<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Xenforo Orange Gradient -->
    <linearGradient id="hzOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Tech Blue Gradient -->
    <linearGradient id="hzBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="hzShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(40, 30)">
    <!-- Squircle base -->
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#0F172A" stroke="#334155" stroke-width="2" filter="url(#hzShadow)" />
    
    <!-- Stylized X crossing -->
    <path d="M 65 60 C 80 60 160 175 180 190 C 190 198 180 205 165 205 C 150 205 75 80 60 68 C 55 64 58 60 65 60 Z" fill="url(#hzBlue)" opacity="0.85" />
    <path d="M 175 60 C 160 60 80 175 60 190 C 50 198 60 205 75 205 C 90 205 165 80 180 68 C 185 64 182 60 175 60 Z" fill="url(#hzOrange)" opacity="0.95" />
    
    <!-- Modern Download Arrow -->
    <path d="M 110 85 C 110 80 130 80 130 85 L 130 145 L 110 145 Z" fill="#F8FAFC" />
    <path d="M 94 135 L 120 168 L 146 135 Z" fill="#F8FAFC" />
    <path d="M 85 180 C 105 188 135 188 155 180" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(330, 150)">
    <!-- XENFORO Brand Name -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      XENFORO
    </text>
    
    <!-- DOWNLOAD Sub-brand / Badge -->
    <g transform="translate(420, -60)">
      <rect x="0" y="0" width="210" height="68" rx="14" fill="url(#hzOrange)" />
      <text x="105" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
        DOWNLOAD
      </text>
    </g>

    <!-- Tagline -->
    <text x="5" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B" letter-spacing="0.5">
      HIGH-SPEED MEDIA &amp; THREAD CRAWLER
    </text>
  </g>
</svg>